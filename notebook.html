<!DOCTYPE html>
<html>
<head>
    <title>Virtual Notebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .notebook-container {
            max-width: 1000px;
            margin: auto;
        }

        .notebook-header {
            text-align: center;
            color: #d4694d;
            margin-bottom: 30px;
        }

        .notebook-header h1 {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .notebook-header p {
            color: #c95a38;
            font-size: 1.1em;
            font-weight: 500;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .notebook-page {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe8d6 100%);
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 3px dashed #ffb380;
            transform: rotate(-2deg);
        }

        .notebook-page:nth-child(2n) {
            transform: rotate(2deg);
        }

        .notebook-page:hover {
            transform: scale(1.1) rotate(0deg);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-color: #ff8c42;
        }

        .notebook-page.active {
            background: linear-gradient(135deg, #ffd9b3 0%, #ffcc99 100%);
            border-color: #ff6b35;
        }

        .page-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 8px;
        }

        .page-title {
            font-size: 1.1em;
            color: #d4694d;
            font-weight: 600;
        }

        .content-area {
            background: linear-gradient(135deg, #fffdf7 0%, #fff5e6 100%);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
            border: 4px solid #ffb380;
        }

        .content-area.active {
            display: block;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .content-area h2 {
            color: #ff6b35;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 2em;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.7);
        }

        .content-area p {
            color: #5f5f5f;
            line-height: 1.6;
            font-size: 1.05em;
        }

        .image-placeholder {
            background: linear-gradient(135deg, #fff9f0 0%, #ffe8d6 100%);
            border: 3px dashed #ffb380;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            color: #c9a882;
            font-size: 1.1em;
            font-weight: 500;
        }

        .image-placeholder img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .notes-area {
            background: linear-gradient(135deg, #fff8f0 0%, #fff0e6 100%);
            border-left: 5px solid #ff8c42;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .notes-area label {
            color: #ff6b35;
            font-weight: 600;
            font-size: 1.05em;
        }

        .notes-area textarea {
            width: 100%;
            border: 2px solid #ffb380;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Arial', sans-serif;
            resize: vertical;
            min-height: 100px;
            margin-top: 10px;
            background-color: white;
            font-size: 1em;
        }

        .notes-area textarea:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .back-button {
            background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.2);
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
        }

        .page-info {
            color: #d4694d;
            font-size: 0.9em;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="notebook-container">
    <div class="notebook-header">
        <h1>📓 My Notebook</h1>
        <p>Click on a page to view its contents</p>
    </div>

    <!-- Pages Grid -->
    <div class="pages-grid" id="pagesGrid">
        <!-- Pages will be generated here -->
    </div>

    <!-- Content Display Area -->
    <div id="contentArea">
        <!-- Content will be displayed here -->
    </div>
</div>

<script>
    // Define notebook pages
    const pages = [
        {
            id: 1,
            title: "Math",
            heading: "Math",
            content: `
                <div class="image-placeholder">
                    <img src=https://storage.googleapis.com/oa_disk001/obgreenhills/65/classfeed/3705/cover_photo/1754352845-3535.png alt="Math Image">
                </div>
                <div class="notes-area">
                    <label><strong>Your Notes:</strong></label><br>
                    <textarea placeholder="Write your notes here..."></textarea>
                </div>
            `
        },
        {
            id: 2,
            title: "Science",
            heading: "Science",
            content: `
                <div class="image-placeholder">
                    <img src=https://storage.googleapis.com/oa_disk001/obgreenhills/65/classfeed/3331/cover_photo/1753923940-187.png alt="Science Image">
                </div>
                <div class="notes-area">
                    <label><strong>Your Notes:</strong></label><br>
                    <textarea placeholder="Write your notes here..."></textarea>
                </div>
            `
        },
        {
            id: 3,
            title: "English",
            heading: "English",
            content: `
                <div class="image-placeholder">
                    <img src=https://storage.googleapis.com/oa_disk001/obgreenhills/65/classfeed/3558/cover_photo/1753944117-124.png alt="English Image">
                </div>
                <div class="notes-area">
                    <label><strong>Your Notes:</strong></label><br>
                    <textarea placeholder="Write your notes here..."></textarea>
                </div>
            `
        },
        {
            id: 4,
            title: "Social Studies",
            heading: "Social Studies",
            content: `
                <div class="image-placeholder">
                    <img src=https://storage.googleapis.com/oa_disk001/obgreenhills/65/classfeed/3665/cover_photo/1754016482-2815.png alt="Social Studies Image">
                </div>
                <div class="notes-area">
                    <label><strong>Your Notes:</strong></label><br>
                    <textarea placeholder="Write your notes here..."></textarea>
                </div>
            `
        },
        {
            id: 5,
            title: "Filipino",
            heading: "Filipino",
            content: `
                <div class="image-placeholder">
                    <img src=https://storage.googleapis.com/oa_disk001/obgreenhills/65/classfeed/3375/cover_photo/1753925126-2417.png alt="Filipino Image">
                </div>
                <div class="notes-area">
                    <label><strong>Your Notes:</strong></label><br>
                    <textarea placeholder="Write your notes here..."></textarea>
                </div>
            `
        }
    ];

    // Initialize the notebook
    function initNotebook() {
        const pagesGrid = document.getElementById('pagesGrid');
        
        pages.forEach(page => {
            const pageButton = document.createElement('div');
            pageButton.className = 'notebook-page';
            pageButton.innerHTML = `
                <div class="page-number">${page.id}</div>
                <div class="page-title">${page.title}</div>
                <div class="page-info">Click to view</div>
            `;
            pageButton.onclick = () => displayPage(page.id);
            pagesGrid.appendChild(pageButton);
        });

        // Display first page by default
        displayPage(1);
    }

    // Display selected page
    function displayPage(pageId) {
        const page = pages.find(p => p.id === pageId);
        const contentArea = document.getElementById('contentArea');
        
        // Update active page button
        document.querySelectorAll('.notebook-page').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === pageId);
        });

        // Display content
        contentArea.innerHTML = `
            <h2>${page.heading}</h2>
            ${page.content}
            <button class="back-button" onclick="scrollToPages()">← Back to Pages</button>
        `;
    }

    // Scroll to pages grid
    function scrollToPages() {
        document.getElementById('pagesGrid').scrollIntoView({ behavior: 'smooth' });
    }

    // Initialize on load
    window.addEventListener('load', initNotebook);
</script>

</body>
</html>
